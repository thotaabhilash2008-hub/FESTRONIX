<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FESTRONIX 2026 — National Level Technical Fest | Vardhaman College of Engineering</title>
    <meta name="description" content="FESTRONIX 2026 — The premier national-level technology festival at Vardhaman College of Engineering, Hyderabad. 30+ events, hackathons, e-sports, and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Keep the original coming-soon fallback on the live site only. The
      // preview build is for testing the full application, so it must never
      // show the registration banner while a feature is being exercised.
      var comingSoonOnly = '%VITE_COMING_SOON_ONLY%';
      if (comingSoonOnly !== 'true') return;
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.childElementCount > 0) return;
        root.innerHTML = ''
          + '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;'
          + 'background:#080c16;color:#fff;font-family:Manrope,Arial,sans-serif;text-align:center;padding:24px">'
          + '<div><div style="font-size:12px;letter-spacing:.36em;color:#38bdf8;font-weight:800">FESTRONIX 2026</div>'
          + '<h1 style="font-size:clamp(28px,6vw,56px);margin:12px 0 8px">REGISTRATIONS OPEN SOON</h1>'
          + '<p style="color:#94a3b8">The excitement is building. We\'re getting everything ready for you.</p>'
          + '</div></div>';
      }, 6000);
    </script>
  </body>
</html>
